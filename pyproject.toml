[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cvmatch"
version = "1.0.0"
description = "Smart CV Screener and Job Matcher — rank CVs against jobs with TF-IDF matching"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Awais Sabit", email = "awaissabit@gmail.com" }]
keywords = ["cv", "recruitment", "job-matching", "tf-idf", "machine-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "pypdf>=4.0",
    "python-docx>=1.0",
]
Homepage = "https://github.com/AwaisSabit/smart-cv-screener-job-matcher"

[project.scripts]
cvmatch = "cvmatch.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
